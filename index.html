<meta charset="utf-8">

<title>All Skills · 技能库</title>
<style>
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --border:#e8e6e3;
    --text:#1a1a1a;
    --muted:#6f6b66;
    --accent:#2563eb;
    --accent-soft:#eef4ff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.05);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1011;
      --surface:#17181a;
      --border:#2a2c30;
      --text:#ececec;
      --muted:#9b9893;
      --accent:#7aa2ff;
      --accent-soft:#1b2740;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}

  /* header */
  header{padding:56px 0 26px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  h1{margin:0 0 8px;font-size:30px;line-height:1.2;letter-spacing:-.02em;font-weight:650}
  .sub{margin:0;color:var(--muted);font-size:13.5px}
  .sub b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .gh{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    height:34px;padding:0 13px;border:1px solid var(--border);border-radius:999px;
    color:var(--muted);font-size:13px;transition:color .15s,border-color .15s,background .15s;
  }
  .gh:hover{color:var(--text);border-color:var(--muted);background:var(--surface)}

  /* toolbar */
  .toolbar{
    position:sticky;top:0;z-index:20;
    padding:14px 0 12px;margin-bottom:8px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:saturate(1.4) blur(14px);
  }
  .search{position:relative;display:flex;align-items:center}
  .search .icon{
    position:absolute;left:14px;width:17px;height:17px;color:var(--muted);pointer-events:none;
  }
  #q{
    width:100%;height:46px;
    padding:0 92px 0 42px;
    border:1px solid var(--border);border-radius:12px;
    background:var(--surface);color:var(--text);
    font:inherit;font-size:15px;
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  #q::placeholder{color:var(--muted);opacity:.8}
  #q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hint{
    position:absolute;right:12px;display:flex;align-items:center;gap:6px;
    color:var(--muted);font-size:11.5px;pointer-events:none;
  }
  kbd{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;padding:0 5px;
    border:1px solid var(--border);border-radius:5px;
    background:var(--bg);font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  #clear{
    position:absolute;right:10px;width:26px;height:26px;padding:0;
    display:none;align-items:center;justify-content:center;
    border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;
  }
  #clear:hover{background:var(--border);color:var(--text)}
  #clear.on{display:flex}
  #clear.on + .hint{display:none}

  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pill{
    height:32px;padding:0 13px;
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--border);border-radius:999px;
    background:transparent;color:var(--muted);
    font:inherit;font-size:13px;cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .pill:hover{color:var(--text);border-color:var(--muted)}
  .pill[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  @media (prefers-color-scheme: dark){
    .pill[aria-pressed="true"]{color:#0b0c0d}
  }
  .pill .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
  .pill[aria-pressed="true"] .n{opacity:.85}

  .result{
    min-height:20px;margin:18px 0 2px;
    color:var(--muted);font-size:12.5px;
  }
  .result:empty{display:none}
  .result b{color:var(--text);font-weight:600}

  /* sections & grid */
  .cat{display:flex;align-items:center;gap:10px;margin:34px 0 14px}
  .cat .bar{width:3px;height:15px;border-radius:2px;background:var(--c);flex:none}
  .cat h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em}
  .cat .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:12px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;gap:8px;
    padding:15px 16px 13px;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);
    transition:border-color .15s,box-shadow .15s,transform .15s;
  }
  .card:hover{border-color:var(--muted);box-shadow:var(--shadow);transform:translateY(-1px)}
  .card .top{display:flex;align-items:flex-start;gap:10px}
  .card h3{
    margin:0;font-size:15px;line-height:1.4;font-weight:600;
    word-break:break-word;
  }
  .card h3 a{transition:color .15s}
  .card h3 a:hover{color:var(--accent)}
  .card h3 a .ext{
    display:inline-block;width:11px;height:11px;margin-left:5px;
    opacity:0;transition:opacity .15s;vertical-align:-1px;color:var(--accent);
  }
  .card:hover h3 a .ext{opacity:.8}
  .card .desc{
    margin:0;color:var(--muted);font-size:13.5px;line-height:1.62;
  }
  .card .foot{
    display:flex;align-items:center;gap:7px;
    margin-top:auto;padding-top:6px;
    color:var(--muted);font-size:11.5px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
  .sep{opacity:.45}
  .path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .copy{
    flex:none;width:26px;height:26px;margin:-2px -4px 0 auto;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:7px;
    background:transparent;color:var(--muted);cursor:pointer;
    opacity:0;transition:opacity .15s,background .15s,color .15s;
  }
  .card:hover .copy,.copy:focus-visible{opacity:1}
  .copy:hover{background:var(--bg);border-color:var(--border);color:var(--text)}
  @media (hover:none){.copy{opacity:1}}

  mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px;font-weight:600}

  .empty{
    padding:72px 0;text-align:center;color:var(--muted);font-size:14px;
  }
  .empty strong{display:block;margin-bottom:6px;color:var(--text);font-size:15px;font-weight:600}
  .empty button{
    margin-top:14px;height:32px;padding:0 14px;
    border:1px solid var(--border);border-radius:999px;
    background:var(--surface);color:var(--text);font:inherit;font-size:13px;cursor:pointer;
  }
  .empty button:hover{border-color:var(--muted)}

  footer{
    margin-top:64px;padding:24px 0 40px;
    border-top:1px solid var(--border);
    color:var(--muted);font-size:12px;
  }

  #toast{
    position:fixed;left:50%;bottom:28px;z-index:50;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:9px 15px;border-radius:10px;
    background:var(--text);color:var(--bg);
    font-size:13px;white-space:nowrap;
    transition:opacity .18s,transform .18s;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .wrap{padding:0 16px}
    header{padding:38px 0 20px}
    h1{font-size:24px}
    .gh{display:none}
    .grid{grid-template-columns:1fr}
    .hint{display:none}
    #q{padding-right:44px}
    .cat{margin:26px 0 12px}
    .result{margin:14px 0 0}
    /* 手机上分类条改成单行横向滚动，避免吸顶区域占掉半屏 */
    .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;margin:12px -16px 0;padding:0 16px 2px}
    .pills::-webkit-scrollbar{display:none}
    .pill{flex:none}
  }
</style>
</head>

  ["crc-offer-cover", "生成 CRC 视觉风格 Offer 封面图文案", 5],
  ["crc-offer-post", "CRC 学员 Offer 小红书帖子全流程生成", 5],
  ["x-article-publisher", "将 Markdown 文章发布到 X (Twitter) Articles", 5],
  ["小红书留学求职ip号帖子改编", "基于人设和参考文章进行换皮仿写", 5],
  ["投流帖改写", "将竞品投流帖改编为橙然 CRC 版本", 5],
];

const collator = new Intl.Collator("zh-Hans-CN", { numeric: true, sensitivity: "base" });
/* SKILLS[i] = { n: 名称, d: 描述, c: 分类下标 } */
const SKILLS = DATA.map(([n, d, c]) => ({ n, d, c }));
SKILLS.sort((a, b) => (a.c - b.c) || collator.compare(a.n, b.n));

document.getElementById("total").textContent = SKILLS.length;

const $q = document.getElementById("q");
const $clear = document.getElementById("clear");
const $pills = document.getElementById("pills");
const $list = document.getElementById("list");
const $result = document.getElementById("result");
const $toast = document.getElementById("toast");

let query = "";
let activeCat = "all";   /* "all" 或 0..5 的分类下标 */
let tokens = [];

function catOf(s) { return CATS[s.c] || { id: "", name: "未分类", color: "#888" }; }

/* pills */
function buildPills() {
  const counts = CATS.map((_, i) => SKILLS.filter(s => s.c === i).length);

  const make = (label, value, count) => {
    const b = document.createElement("button");
    b.className = "pill";
    b.dataset.cat = String(value);
    b.innerHTML = `${label} <span class="n">${count}</span>`;
    return b;
  };

  $pills.appendChild(make("全部", "all", SKILLS.length));
  CATS.forEach((c, i) => $pills.appendChild(make(c.name, i, counts[i])));

  $pills.addEventListener("click", e => {
    const btn = e.target.closest(".pill");
    if (!btn) return;
    const v = btn.dataset.cat;
    activeCat = v === "all" ? "all" : Number(v);
    syncHash();
    syncPills();
    render();
  });
}

function syncPills() {
  $pills.querySelectorAll(".pill").forEach(b => {
    const v = b.dataset.cat;
    const same = v === "all" ? activeCat === "all" : Number(v) === activeCat;
    b.setAttribute("aria-pressed", String(same));
  });
}

/* utils */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function hl(s) {
  if (!tokens.length) return esc(s);
  const re = new RegExp("(" + tokens.map(escapeRe).join("|") + ")", "gi");
  return String(s).split(re).map((p, i) => i % 2 ? "<mark>" + esc(p) + "</mark>" : esc(p)).join("");
}
function card(s) {
  const cat = catOf(s);
  const rel = cat.id + "/" + s.n;
  const url = REPO + cat.id.split("/").map(encodeURIComponent).join("/") + "/" + encodeURIComponent(s.n);
  return `<article class="card">
    <div class="top">
      <h3><a href="${url}" target="_blank" rel="noopener">${hl(s.n)}<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a></h3>
      <button class="copy" data-path="${esc(rel)}" aria-label="复制路径" title="复制路径">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>
    <p class="desc">${hl(s.d)}</p>
    <div class="foot" title="${esc(rel)}"><span class="dot" style="--c:${cat.color}"></span><span>${esc(cat.name)}</span></div>
  </article>`;
}

function render() {
  const q = query.trim().toLowerCase();
  tokens = q ? q.split(/\s+/).filter(Boolean) : [];

  let matched = SKILLS.filter(s => {
    if (activeCat !== "all" && s.c !== activeCat) return false;
    if (!tokens.length) return true;
    const cat = catOf(s);
    const hay = (s.n + " " + s.d + " " + cat.id + " " + cat.name).toLowerCase();
    return tokens.every(t => hay.includes(t));
  });

  /* 相关度：名称命中 > 描述命中 > 只命中分类；同分保持分类+名称顺序 */
  if (tokens.length) {
    const score = s => {
      const name = s.n.toLowerCase(), desc = s.d.toLowerCase();
      if (tokens.every(t => name.includes(t))) return 0;
      if (name.includes(tokens[0])) return 1;
      if (tokens.every(t => (name + " " + desc).includes(t))) return 2;
      return 3;
    };
    matched = matched
      .map((s, i) => ({ s, i, k: score(s) }))
      .sort((a, b) => (a.k - b.k) || (a.i - b.i))
      .map(x => x.s);
  }

  const searching = tokens.length > 0 || activeCat !== "all";
  const catLabel = activeCat === "all" ? "" : catOf({ c: activeCat }).name;
  $result.innerHTML = searching
    ? `找到 <b>${matched.length}</b> 个技能${catLabel ? " · " + esc(catLabel) : ""}`
    : "";

  if (!matched.length) {
    $list.innerHTML = `<div class="empty"><strong>没有匹配的技能</strong>换个词试试，或者看看全部分类<button onclick="resetAll()">清除筛选</button></div>`;
    return;
  }

  if (searching) {
    $list.innerHTML = `<div class="grid" style="margin-top:10px">${matched.map(card).join("")}</div>`;
    return;
  }

  $list.innerHTML = CATS.map((c, i) => {
    const items = matched.filter(s => s.c === i);
    if (!items.length) return "";
    return `<section><div class="cat"><span class="bar" style="--c:${c.color}"></span><h2>${esc(c.name)}</h2><span class="n">${items.length}</span></div><div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");
}

/* events */
$q.addEventListener("input", () => {
  query = $q.value;
  $clear.classList.toggle("on", query.length > 0);
  render();
});
$clear.addEventListener("click", () => { $q.value = ""; query = ""; $clear.classList.remove("on"); $q.focus(); render(); });

document.addEventListener("keydown", e => {
  const tag = document.activeElement && document.activeElement.tagName;
  const typing = tag === "INPUT" || tag === "TEXTAREA";
  if (e.key === "/" && !typing) { e.preventDefault(); $q.focus(); }
  if (e.key === "Escape" && ($q.value || activeCat !== "all")) { resetAll(); }
});

function resetAll() {
  $q.value = ""; query = ""; $clear.classList.remove("on");
  activeCat = "all"; syncHash(); syncPills(); render();
}
window.resetAll = resetAll;

$list.addEventListener("click", e => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  e.preventDefault();
  copy(btn.dataset.path);
});

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制 " + text);
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("已复制 " + text); }
    catch (e2) { toast("复制失败，请手动选择路径"); }
    document.body.removeChild(ta);
  }
}

let toastTimer;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("on"), 1600);
}

/* hash routing: #01-写作与内容 */
function syncHash() {
  const id = activeCat === "all" ? "" : CATS[activeCat].id;
  const h = id ? "#" + encodeURIComponent(id) : "";
  if (location.hash !== h) history.replaceState(null, "", h || location.pathname + location.search);
}
function readHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  const i = CATS.findIndex(c => c.id === raw);
  if (i >= 0) activeCat = i;
}
window.addEventListener("hashchange", () => { readHash(); syncPills(); render(); });

buildPills();
readHash();
syncPills();
render();
</script>
</body>
</html>
